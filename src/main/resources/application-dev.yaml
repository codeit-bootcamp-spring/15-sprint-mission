spring:
  application:
    name: discodeit
  datasource:
    url: jdbc:postgresql://${SPRING_DATASOURCE_URL}:5432/discodeit
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

server:
  port: 8081

logging:
  level:
    root: info
    com.sprint.mission.discodeit: debug
