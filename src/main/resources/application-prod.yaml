spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/discodeit
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    show-sql: false

server:
  port: 8081

logging:
  level:
    com.sprint.mission.discodeit: INFO
    org.hibernate.orm.jdbc.bind: "OFF"

management:
  info:
    env:
      enabled: false
