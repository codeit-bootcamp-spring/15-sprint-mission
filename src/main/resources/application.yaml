spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  datasource:
    url: jdbc:postgresql://localhost:5432/discodeit
    username: discodeit_user
    password: discodeit1234
    driver-class-name: org.postgresql.Driver

  jackson:
    default-property-inclusion: non_null

  sql:
    init:
      mode: always # 앱 구동 시 schema.sql 자동 실행
      schema-locations: classpath:schema.sql
      continue-on-error: true # 스크립트 실행 중 에러가 나도 앱 구동 유지

  jpa:
    defer-datasource-initialization: true # JPA 초기화 후 SQL 스크립트 실행 보장
    hibernate:
      ddl-auto: update # schema.sql 기반 검증을 원할 경우 validate로 변경 가능
    properties:
      hibernate:
        format_sql: true
        show_sql: true
    open-in-view: false # OSIV 비활성화 (DTO 도입 및 영속성 컨텍스트 계층 분리)

logging:
  level:
    org.hibernate.SQL: debug              # 생성된 SQL 쿼리 로그
    org.hibernate.orm.jdbc.bind: trace    # 바인딩 파라미터 값 출력

discodeit:
  storage:
    type: local
    local:
      root-path: uploads # 로컬 스토리지 루트 디렉토리