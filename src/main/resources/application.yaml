spring:
  application:
    name: discodeit

  profiles:
    default: prod

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 101MB

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

    properties:
      hibernate:
        format_sql: true

    open-in-view: false



logging:
  level:
    org.hibernate.orm.jdbc.bind: trace
    org.springframework.transaction.interceptor: TRACE
    org.springframework.orm.jpa.JpaTransactionManager: DEBUG
    root: INFO


discodeit:
  storage:
    type: local
    local:
      root-path: ./file-data-map/BinaryContentStorage
