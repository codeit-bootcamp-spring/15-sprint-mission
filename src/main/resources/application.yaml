spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/discodeit
    username: discodeit_user
    password: discodeit1234
    driver-class-name: org.postgresql.Driver

  sql:
    init:
      mode: always # 앱 구동 시 schema.sql 자동 실행
      schema-locations: classpath:schema.sql

  jpa:
    hibernate:
      ddl-auto: update # schema.sql 기반으로 테이블을 관리하고 엔티티와 일치하는지 검증
    properties:
      hibernate:
        format_sql: true
        show_sql: true
    open-in-view: false # OSIV 비활성화 (성능 및 계층 분리)

logging:
  level:
    org.hibernate.SQL: debug              # 생성된 SQL 쿼리 로그
    org.hibernate.orm.jdbc.bind: trace